<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Charan Kuramana</title>
    <!--
      Single-Page-App fallback for GitHub Pages.
      Redirects deep links (e.g. /charan_portfolio/projects) back to index.html,
      which restores the route via the decoder script in index.html.
      pathSegmentsToKeep = 1 keeps the project base "/charan_portfolio".
    -->
    <script>
        (function () {
            var pathSegmentsToKeep = 1;
            var l = window.location;
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
                l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
                (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                l.hash
            );
        })();
    </script>
</head>

<body></body>

</html>
