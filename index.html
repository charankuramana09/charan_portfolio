<!doctype html>
<html lang="en" style="scroll-behavior:smooth">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f6f7fb" />

    <!-- Apply saved theme before paint (default: light) to avoid a flash -->
    <script>
        (function () {
            try {
                if (localStorage.getItem('theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (e) { /* ignore */ }
        })();
    </script>

    <!-- SPA deep-link restore for GitHub Pages (pairs with public/404.html) -->
    <script>
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
        }(window.location));
    </script>

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">

    <!-- Fonts (loaded via link instead of CSS @import for non-blocking render) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">

    <!-- Primary Meta Tags -->
    <title>Charan Kuramana — Full Stack Java & React Developer</title>
    <meta name="title" content="Charan Kuramana — Full Stack Java & React Developer">
    <meta name="description"
        content="Portfolio of Charan Kuramana, a Full Stack Developer specializing in Java, Spring Boot, Microservices, and React. Building scalable and performant web applications.">
    <meta name="keywords"
        content="Charan Kuramana, Full Stack Developer, Java, Spring Boot, React, Portfolio, Hyderabad, India">
    <meta name="author" content="Charan Kuramana">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://charankuramana09.github.io/charan_portfolio/">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://charankuramana09.github.io/charan_portfolio/">
    <meta property="og:title" content="Charan Kuramana — Full Stack Developer">
    <meta property="og:description"
        content="Building scalable, secure, and user-focused web applications with Java & React.">
    <meta property="og:image" content="https://charankuramana09.github.io/charan_portfolio/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Charan Kuramana — Full Stack Java & React Developer">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://charankuramana09.github.io/charan_portfolio/">
    <meta property="twitter:title" content="Charan Kuramana — Full Stack Developer">
    <meta property="twitter:description"
        content="Building scalable, secure, and user-focused web applications with Java & React.">
    <meta property="twitter:image" content="https://charankuramana09.github.io/charan_portfolio/og.png">

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Charan Kuramana",
      "jobTitle": "Full Stack Developer",
      "url": "https://charankuramana09.github.io/charan_portfolio/",
      "sameAs": [
        "https://github.com/charankuramana09",
        "https://www.linkedin.com/in/charan-kuramana-145282249/"
      ],
      "knowsAbout": ["Java", "Spring Boot", "React", "Microservices", "Full Stack Development"]
    }
    </script>
</head>

<body>
    <!-- Instant inline splash loader (removed once the app mounts; never waits on images) -->
    <style>
        #app-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f6f7fb;
            transition: opacity .55s ease, visibility .55s ease;
        }
        html.dark #app-loader { background: #050811; }
        #app-loader.app-loader--hidden { opacity: 0; visibility: hidden; }
        .al-wrap { display: flex; flex-direction: column; align-items: center; gap: 22px; }
        .al-badge {
            position: relative;
            width: 76px;
            height: 76px;
            display: grid;
            place-items: center;
            animation: al-pulse 1.6s ease-in-out infinite;
        }
        .al-ring {
            position: absolute;
            inset: -12px;
            border-radius: 9999px;
            background: conic-gradient(from 0deg, #6366f1, #8b5cf6, #22d3ee, #6366f1);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
            animation: al-spin 1s linear infinite;
        }
        .al-name {
            font-family: "Sora", system-ui, sans-serif;
            font-weight: 700;
            letter-spacing: .04em;
            font-size: 15px;
            color: #64748b;
        }
        @keyframes al-spin { to { transform: rotate(360deg); } }
        @keyframes al-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
        @media (prefers-reduced-motion: reduce) {
            .al-ring, .al-badge { animation: none; }
        }
    </style>
    <div id="app-loader" role="status" aria-label="Loading">
        <div class="al-wrap">
            <div class="al-badge">
                <div class="al-ring"></div>
                <svg width="56" height="56" viewBox="0 0 64 64" aria-hidden="true">
                    <defs>
                        <linearGradient id="al-g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                            <stop offset="0" stop-color="#6366f1" />
                            <stop offset="0.55" stop-color="#8b5cf6" />
                            <stop offset="1" stop-color="#22d3ee" />
                        </linearGradient>
                    </defs>
                    <rect width="64" height="64" rx="16" fill="url(#al-g)" />
                    <path d="M43.3 20.7 A16 16 0 1 0 43.3 43.3" fill="none" stroke="#fff" stroke-width="7.5" stroke-linecap="round" />
                    <circle cx="47" cy="46" r="4" fill="#fff" />
                </svg>
            </div>
            <div class="al-name">Charan Kuramana</div>
        </div>
    </div>

    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
</body>

</html>
